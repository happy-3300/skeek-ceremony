<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Skeek Al Doha</title>
<link rel="preload" as="image" href="assets/ribbons.png">
<link rel="preload" as="image" href="assets/lines.png">
<link rel="preload" as="image" href="assets/button-on.png">
<link rel="preload" as="image" href="assets/lines-lit.png">
<style>
  /* Artboard from the PDF: 2064 x 2752 pt. All positions below are in % of it. */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #faf3e9;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }

  /* Stage keeps the 3:4 artboard ratio and covers the screen (centered). */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width:  max(100vw, calc(100vh * 2064 / 2752));
    height: max(100vh, calc(100vw * 2752 / 2064));
    transform: translate(-50%, -50%);
    background: #faf3e9 url("assets/ribbons.png") center / 100% 100% no-repeat;
  }
  .stage img {
    position: absolute; display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* left/top/width/height = pt / 2064 or pt / 2752 */
  .logo     { left: 37.112%; top: 18.532%; width: 25.775%; height: 21.112%; }
  .text-touch   { left: 16.667%; top: 76.708%; width: 66.604%; height:  8.783%; }
  .text-journey { left: 16.279%; top: 21.948%; width: 67.621%; height: 14.244%; } /* centred where the logo was */
  .lines-base   { left: 0; top: 0; width: 100%; height: 100%; }

  .button {
    position: absolute;
    left: 34.351%; top: 46.684%; width: 31.023%; height: 23.412%;
    cursor: pointer;
  }
  /* off image fills the button box; on image is larger (glow) and offset as in the PDF */
  .button .off { left: 0; top: 0; width: 100%; height: 100%; }
  .button .on  { left: -7.895%; top: -7.858%; width: 122.077%; height: 114.247%; opacity: 0; }

  /* ---- transitions ---- */
  .button, .text-touch { transition: opacity 2.2s ease-in-out; }
  .button .on  { transition: opacity .7s ease-out; }
  .text-journey { opacity: 0; transition: opacity 2.4s ease-in-out; }

  .stage.lit .button .on { opacity: 1; }
  .stage.fade .button,
  .stage.fade .text-touch { opacity: 0; }
  .stage.journey .text-journey { opacity: 1; }

  .button:active .off { transform: scale(.985); }
  .stage.lit .button { pointer-events: none; }

  /* ---- building lines light up, bottom to top ----
     The wrapper slides up while the image inside slides down by the same amount,
     so the image stays put and is revealed from the bottom. Transform-only = GPU smooth.
     Wrapper is 115% tall; its top 15% is a soft feathered edge. */
  .lights {
    position: absolute; left: 0; top: -15%; width: 100%; height: 115%;
    overflow: hidden; pointer-events: none;
    transform: translate3d(0, 100%, 0);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 13%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 13%);
  }
  .lights img {
    left: 0; top: 13.0435%; width: 100%; height: 86.9565%; /* = the stage */
    transform: translate3d(0, -115%, 0);
  }
  .lights, .lights img { transition: transform 2.8s cubic-bezier(.42, 0, 1, 1); will-change: transform; }
  .stage.glow .lights, .stage.glow .lights img { transform: translate3d(0, 0, 0); }

  /* after the sweep: building lines (plain + lit) and the logo fade away, leaving the clean background */
  .lights-inner { position: absolute; inset: 0; }
  .lines-base, .lights-inner, .logo { transition: opacity 2.2s ease-in-out; }
  .stage.clear .lines-base, .stage.clear .lights-inner, .stage.clear .logo { opacity: 0; }

  /* ---- destinations: five landmarks linked by a glowing route ---- */
  .route-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .route-svg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .route-svg .glow { stroke: #ff8f1f; stroke-width: 12; stroke-opacity: .18; }
  .route-svg .core { stroke: #ff8f1f; stroke-width: 3.5; }

  .icon { position: absolute; pointer-events: none; }
  .icon img { left: 0; top: 0; width: 100%; height: 100%; }
  /* shadows fade in, in place, as the building settles (never moved, so they always line up with it) */
  .icon .sh  { opacity: 0; transition: opacity 1.8s ease-in-out calc(var(--d, 0s) + .8s); }
  .icon .sun { opacity: 0; transform: translate3d(0, 12%, 0) scale(.9); transform-origin: 50% 70%;
               transition: opacity 1s ease-out var(--d, 0s), transform 1.8s cubic-bezier(.2, .7, .2, 1) var(--d, 0s); }
  .icon .bd  { opacity: 0; transform: translate3d(0, 4%, 0);
               transition: opacity 1.1s ease-out calc(var(--d, 0s) + .2s), transform 1.5s cubic-bezier(.2, .7, .2, 1) calc(var(--d, 0s) + .2s); }
  .stage.route .icon img { opacity: 1; transform: none; }

  .stage.instant, .stage.instant * { transition: none !important; animation: none !important; }

  /* hidden reset: double-tap top-left corner */
  .reset { position: absolute; left: 0; top: 0; width: 12%; height: 9%; z-index: 5; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="lines-base" src="assets/lines.png" alt="">
    <div class="lights-inner"><div class="lights"><img src="assets/lines-lit.png" alt=""></div></div>
    <svg class="route-svg" viewBox="0 0 2064 2752" preserveAspectRatio="none" aria-hidden="true">
      <path class="glow" id="routeGlow"/>
      <path class="core" id="route"/>
    </svg>
    <div class="icon"><img class="sh" src="assets/icons/fereej-al-asmakh-shadow.png" alt=""><img class="sun" src="assets/icons/fereej-al-asmakh-sun.png" alt=""><img class="bd" src="assets/icons/fereej-al-asmakh-building.png" alt="Fereej Al Asmakh"></div>
    <div class="icon"><img class="sh" src="assets/icons/bayt-al-zaman-shadow.png" alt=""><img class="sun" src="assets/icons/bayt-al-zaman-sun.png" alt=""><img class="bd" src="assets/icons/bayt-al-zaman-building.png" alt="Bayt Al Zaman"></div>
    <div class="icon"><img class="sh" src="assets/icons/dar-al-kutub-shadow.png" alt=""><img class="sun" src="assets/icons/dar-al-kutub-sun.png" alt=""><img class="bd" src="assets/icons/dar-al-kutub-building.png" alt="Dar Al Kutub Al Qatariya"></div>
    <div class="icon"><img class="sh" src="assets/icons/founder-house-shadow.png" alt=""><img class="sun" src="assets/icons/founder-house-sun.png" alt=""><img class="bd" src="assets/icons/founder-house-building.png" alt="Founder's House"></div>
    <div class="icon"><img class="sh" src="assets/icons/doha-stadium-shadow.png" alt=""><img class="sun" src="assets/icons/doha-stadium-sun.png" alt=""><img class="bd" src="assets/icons/doha-stadium-building.png" alt="Doha Stadium"></div>
    <img class="logo" src="assets/logo.png" alt="Skeek Al Doha">
    <div class="button" id="btn" role="button" aria-label="Turn on">
      <img class="off" src="assets/button-off.png" alt="">
      <img class="on"  src="assets/button-on.png"  alt="">
    </div>
    <img class="text-touch" src="assets/text-touch.png" alt="Your touch lights up Skeek Al Doha">
    <img class="text-journey" src="assets/text-journey.png" alt="The journey starts here">
    <div class="reset" id="reset"></div>
  </div>

<script>
  // Timing (ms)
  const GLOW_AT    = 0;    // building lines start lighting up (on tap)
  const SWEEP      = 2800; // bottom-to-top sweep (matches CSS)

  const CLEAR_AT   = SWEEP + 400;  // button, first text, lines + logo all fade out together after the sweep
  const CLEAR_FADE = 2200;         // (matches CSS)
  const JOURNEY_AT = CLEAR_AT + CLEAR_FADE - 600; // journey text appears where the logo was
  const ROUTE_AT   = JOURNEY_AT + 1400;           // route + landmarks
  const ROUTE_DRAW = 4200; // line drawing time, left to right

  // Landmarks, in route order (matches the .icon elements). Measured in the designer's icon artboard units:
  // sun = circle centre + radius, x0/x1 = visible left/right edge (building or sun), bottom = building ground line.
  const LANDMARKS = [
    { name: 'fereej',   sun: [254.43, 222.93, 125.80], x0: 100.8, x1: 483.3, bottom: 387.5 }, // orange
    { name: 'bayt',     sun: [286.93, 209.38, 134.58], x0: 118.3, x1: 474.2, bottom: 372.5 }, // beige
    { name: 'dar',      sun: [310.73, 224.10, 131.43], x0: 113.3, x1: 504.2, bottom: 365.0 }, // blue
    { name: 'founder',  sun: [311.76, 202.56, 119.98], x0: 141.7, x1: 486.7, bottom: 341.7 }, // purple
    { name: 'stadium',  sun: [298.74, 246.92, 148.78], x0:  74.2, x1: 515.8, bottom: 367.5 }, // red (half disc)
  ];
  // Layout (artboard pt): every sun is drawn at the same radius; 1st/3rd/5th on the top row, 2nd/4th below.
  const SUN_R  = 160;   // sun radius
  const MARGIN = 170;   // gap between the outer landmarks and the screen edges (same both sides)
  const ROW_Y  = [1560, 2100]; // sun-centre height of the top and bottom rows

  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn');

  // ---- lay out icons + route ----
  (function layoutRoute() {
    const AW = 2064, AH = 2752;
    // layer PNGs cover icon units x -170..750, y -30..570 (padding so shadows fade out naturally)
    const icons = [...document.querySelectorAll('.icon')];
    const L = LANDMARKS.map(m => { const k = SUN_R / m.sun[2]; return { ...m, k, w: (m.x1 - m.x0) * k, cu: (m.x0 + m.x1) / 2 }; });
    // top row: equal gaps between visible edges, equal margins to the screen edges
    const top = [0, 2, 4], gap = (AW - 2 * MARGIN - top.reduce((a, i) => a + L[i].w, 0)) / (top.length - 1);
    let x = MARGIN; top.forEach(i => { L[i].cx = x + L[i].w / 2; x += L[i].w + gap; });
    // bottom row sits centred between its neighbours above
    [1, 3].forEach(i => { L[i].cx = (L[i - 1].cx + L[i + 1].cx) / 2; });
    L.forEach((m, i) => { m.cy = ROW_Y[i % 2]; });
    const base = L.map(m => ({ x: m.cx, y: m.cy + (m.bottom - 8 - m.sun[1]) * m.k })); // route runs along each building's ground line
    icons.forEach((el, i) => {
      const m = L[i], ox = m.cx - m.cu * m.k, oy = m.cy - m.sun[1] * m.k; // artboard position of icon unit (0,0)
      Object.assign(el.style, {
        left:   ((ox - 170 * m.k) / AW * 100) + '%',
        top:    ((oy - 30 * m.k) / AH * 100) + '%',
        width:  (920 * m.k / AW * 100) + '%',
        height: (600 * m.k / AH * 100) + '%',
      });
      // shadow grows out from the building's base
      el.style.setProperty('--ox', ((m.cu + 170) / 920 * 100) + '%');
      el.style.setProperty('--oy', ((m.bottom + 30) / 600 * 100) + '%');
    });
    // smooth curve through the stops (Catmull-Rom -> cubic Bezier)
    const P = [base[0], ...base, base[base.length - 1]];
    let d = `M ${base[0].x} ${base[0].y}`;
    for (let i = 1; i < P.length - 2; i++) {
      const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
      d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6}, ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6}, ${p2.x} ${p2.y}`;
    }
    const paths = [document.getElementById('route'), document.getElementById('routeGlow')];
    paths.forEach(p => p.setAttribute('d', d));
    const len = paths[0].getTotalLength();
    paths.forEach(p => { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; });
    // each icon appears as the line reaches it
    const lengthAtX = x => { let lo = 0, hi = len; for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; (paths[0].getPointAtLength(m).x < x ? lo = m : hi = m); } return lo; };
    icons.forEach((el, i) => el.style.setProperty('--d', Math.max(0, lengthAtX(base[i].x) / len * ROUTE_DRAW - 250) / 1000 + 's'));
    window.__route = { paths, len };
  })();

  function drawRoute(on) {
    const { paths, len } = window.__route;
    paths.forEach(p => {
      p.style.transition = on ? `stroke-dashoffset ${ROUTE_DRAW}ms linear` : 'none';
      p.style.strokeDashoffset = on ? 0 : len;
    });
  }
  let timers = [];
  let started = false;

  function start(e) {
    if (e) e.preventDefault();
    if (started) return;
    started = true;
    stage.classList.add('lit');
    timers.push(setTimeout(() => stage.classList.add('glow'), GLOW_AT));
    timers.push(setTimeout(() => stage.classList.add('clear'), CLEAR_AT));
    timers.push(setTimeout(() => stage.classList.add('fade'), CLEAR_AT));
    timers.push(setTimeout(() => stage.classList.add('journey'), JOURNEY_AT));
    timers.push(setTimeout(() => { stage.classList.add('route'); drawRoute(true); }, ROUTE_AT));
  }

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    stage.classList.add('instant');
    stage.classList.remove('lit', 'fade', 'journey', 'glow', 'clear', 'route');
    drawRoute(false);
    void stage.offsetWidth; // apply instantly, then re-enable transitions
    stage.classList.remove('instant');
    started = false;
  }

  // decode every image up front so the first frame of each animation is smooth
  document.querySelectorAll('img').forEach(img => img.decode && img.decode().catch(() => {}));

  btn.addEventListener('pointerdown', start);

  let lastTap = 0;
  document.getElementById('reset').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < 400) reset();
    lastTap = now;
  });

  // block pinch / double-tap zoom & context menu on iPad Safari
  ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
</script>
</body>
</html>
